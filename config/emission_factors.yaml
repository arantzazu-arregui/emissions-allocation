# =============================================================================
# Table 19 -- SFC_base (g/kWh) by engine type, fuel and year built
# printed pp.70-71 / PDF pp.98-99.  Used by §3.4 and §4.4.
# Only the 2001+ column is carried: both pilot hulls are post-2001 builds.
# =============================================================================
sfc_base:
  table: "Table 19"
  page: {printed: [70, 71], pdf: [98, 99]}
  year_built_column: "2001+"
  unit: g/kWh
  engines:
    SSD:               {HFO: 175, MDO: 165}    # slow-speed diesel, main engine
    MSD:               {HFO: 195, MDO: 185}    # medium-speed diesel
    HSD:               {HFO: 205, MDO: 190}    # high-speed diesel
    auxiliary_engine:  {HFO: 195, MDO: 185, LNG: 156}
    boiler:            {HFO: 340, MDO: 320, LNG: 285}   # "Steam Turbines (and boilers)"

# =============================================================================
# §4.4 -- main engine load correction, IMO equation (10), verbatim
#   SFC_ME,i = SFC_base * (0.455*Load^2 - 0.710*Load + 1.280)
# printed p.71 / PDF p.99.
# =============================================================================
load_correction:
  equation: "IMO Fourth GHG Study 2020, equation (10)"
  page: {printed: 71, pdf: 99}
  form: "SFC_base * (a*Load^2 + b*Load + c)"
  a: 0.455
  b: -0.710
  c: 1.280
  # The quadratic minimises at -b/2a = 0.710/(2*0.455) = 0.7802, matching the
  # source's stated "most efficient load at around 80% MCR". This is an internal
  # check that the coefficients are transcribed correctly, and is asserted in
  # tests/test_emissions_model.py.
  minimises_at: 0.7802197802197802

  # Equation (11): auxiliary engines and boilers are NOT corrected by CF_L.
  #   FC_AE|BO,i = SFC_base * W_AE|BO,i
  aux_boiler_load_corrected: false

  # p.70: "At engine loads below 7%, fuel consumption and all the emissions
  # derived from the main engine are assumed to be zero."
  main_engine_cutoff_load: 0.07

# =============================================================================
# Table 20 -- Low load adjustment factors
# printed p.74 / PDF p.102.  Used by §3.5.
# =============================================================================
low_load_factors:
  table: "Table 20"
  page: {printed: 74, pdf: 102}
  # CO2's LLF is 1.00 at EVERY load, so no adjustment is applied anywhere in this
  # project. Footnote: "These pollutants vary directly as a function of fuel
  # consumption, which itself is a function of engine load, so LLFs are not applied."
  CO2:
    "<=2%": 1.00
    "10%":  1.00
    "20%":  1.00
  applied: false

# =============================================================================
# Table 21 -- Fuel-based emission factors
# printed p.74 / PDF p.102.  Used by §3.3.
# =============================================================================
emission_factors:
  table: "Table 21"
  page: {printed: 74, pdf: 102}
  unit: g CO2 / g fuel
  fuels:
    HFO:         {carbon_content: 0.8493, ef_f: 3.114}
    LSHFO_1.0:   {carbon_content: 0.8493, ef_f: 3.114}
    MDO:         {carbon_content: 0.8744, ef_f: 3.206}
    LNG:         {carbon_content: 0.7500, ef_f: 2.750}
    Methanol:    {carbon_content: 0.3750, ef_f: 1.375}
  # "'MDO' refers to distillate marine fuels in general, which would include
  # marine gas oil (MGO). For low-sulphur HFO fuels it was assumed the same
  # carbon content and EF_f than with HFO."
  #
  # §3.2: the IMO 2020 sulphur cap is therefore IMMATERIAL to CO2. LSHFO carries
  # the same factor as HFO, and scrubber fitting affects SOx only. The fuel-switch
  # date is recorded for transparency but does not change the result.

# =============================================================================
# §3.1 -- fuel assignment rule (Selin et al. 2021, following the IMO study)
# =============================================================================
fuel_assignment:
  # Distillate (MDO/MGO) when ANY condition holds; residual (HFO) otherwise.
  distillate_when:
    - main_engine_is_high_speed      # HSD -- not applicable to either pilot hull
    - inside_eca                     # point-in-polygon, §3.1 condition 2
    - voyage_leg_is_eu_to_eu         # from voyage_leg.is_eu_eu, §3.1 condition 3
  residual_fuel: HFO
  distillate_fuel: MDO

  # Fleet-only fallback; inactive for the pilot. Apply Table 9 to IHS main-fuel
  # fields first, then infill an unresolved vessel from the unique modal fuel of
  # successfully allocated peers in the same vessel-type x size-bin group.
  # It never replaces the primary vessel-hour location/voyage rule.
  imo_table_9_fallback:
    enabled: false
    source: "Fourth IMO GHG Study 2020, printed pp. 46-47, Table 9"
    method: "IHS FuelType1First/FuelType2Second allocation, then vessel-type x size-bin modal infill"
    group_by: [vessel_type, size_bin]
    primary_rule_precedence: true

  eca:
    source: "Marine Regions -- MARPOL Annex VI Regulation 14 (SOx and PM)"
    file: data/external/marineregions/eca_reg14_sox_pm.zip
    polygons: [Baltic Sea, North Sea, US Caribbean, North American 1, North American 2, North American 3]
    # The shapefile PREDATES the Mediterranean SOx ECA (in force May 2025).
    # Irrelevant to a period ending 2024; must be added if the horizon extends.
    mediterranean_included: false

# =============================================================================
# §6.1 -- unit conversions
# =============================================================================
conversions:
  # Global Carbon Budget reports million tonnes of CARBON, not CO2.
  mtc_to_mtco2:
    value: 3.664
    source: "docs/METHODOLOGY.md §6.1; ratio of molar masses CO2:C = 44.009/12.011"
  # UNdata bunker CSVs use "Metric tons, thousand".
  undata_thousand_tonnes_to_tonnes:
    value: 1000
    source: "UNdata, UN Energy Statistics Database -- unit string 'Metric tons, thousand'"
