# IMO Fourth GHG Study 2020 constants, as data.
#
# Every table below was extracted from
#   data/external/imo/Fourth-IMO-GHG-Study-2020-Full-report-and-annexes_compressed.pdf
# and verified against the rendered page, not only against `pdftotext` output --
# several of this report's tables are images that text extraction mangles or drops.
# Printed page numbers are given alongside PDF page numbers because they differ by 28.

source:
  document: "IMO (2020). Fourth IMO Greenhouse Gas Study 2020"
  file: data/external/imo/Fourth-IMO-GHG-Study-2020-Full-report-and-annexes_compressed.pdf
  extracted: 2026-08-16
  method: "pdftotext -layout, each table confirmed against a pdftoppm render of the page"

# =============================================================================
# Table 16 -- Operational phase assignment decision matrix
# printed p.66 / PDF p.94.  Used by §4.1.
# =============================================================================
operating_mode_matrix:
  table: "Table 16"
  page: {printed: 66, pdf: 94}

  # The five columns are an ORDERED LADDER: the first applicable column wins.
  #
  # !! The 'Port 1-5 nm' column is footnoted in the source:
  # !!   "* Applicable to chemical tankers, liquified gas tankers, oil tankers
  # !!    and other liquids tankers only."
  # !! because liquid tankers are often lightered offshore and so can berth
  # !! within 5 nm of port. docs/METHODOLOGY.md §4.1 reproduces this column
  # !! WITHOUT the footnote, which would wrongly let a container ship be
  # !! "At berth" up to 5 nm from port. See docs/METHODOLOGY.md open items.
  columns:
    - {key: port_le_1,  bound: "port distance <= 1 nm",       applies_to: all}
    - {key: port_1_5,   bound: "port distance 1-5 nm",        applies_to: liquid_tankers_only}
    - {key: coast_le_1, bound: "coast distance <= 1 nm",      applies_to: all}
    - {key: coast_1_5,  bound: "coast distance 1-5 nm",       applies_to: all}
    - {key: coast_ge_5, bound: "coast distance >= 5 nm",      applies_to: all}

  liquid_tanker_types: [chemical_tanker, liquefied_gas_tanker, oil_tanker, other_liquids_tanker]

  # Speed-band boundaries are inclusive as the source states them:
  #   "1<=" , "1-3 (incl. 3)" , "3-5 (incl. 5)" , ">5"
  # i.e. sog <= 1 | 1 < sog <= 3 | 3 < sog <= 5 | sog > 5. A clean partition.
  # docs/METHODOLOGY.md §4.1 writes the bands without stating inclusivity.
  rows:
    - {sog_max: 1.0,               me_load: null,
       modes: [at_berth,    at_berth,        anchored,        anchored,        anchored]}
    - {sog_min: 1.0, sog_max: 3.0, me_load: null,
       modes: [anchored,    anchored,        anchored,        anchored,        anchored]}
    - {sog_min: 3.0, sog_max: 5.0, me_load_max: 0.65,
       modes: [manoeuvring, manoeuvring,     manoeuvring,     manoeuvring,     slow_transit]}
    - {sog_min: 3.0, sog_max: 5.0, me_load_min: 0.65,
       modes: [manoeuvring, manoeuvring,     manoeuvring,     manoeuvring,     normal_cruising]}
    - {sog_min: 5.0,               me_load_max: 0.65,
       modes: [manoeuvring, slow_transit,    slow_transit,    slow_transit,    slow_transit]}
    - {sog_min: 5.0,               me_load_min: 0.65,
       modes: [manoeuvring, normal_cruising, normal_cruising, normal_cruising, normal_cruising]}

  # The source measures coast distance against Natural Earth coastline shapefiles
  # and port distance against its own port point dataset (each port a single point).
  distance_reference:
    coast: "Natural Earth coastline shapefiles (as used by the source study)"
    port: "port dataset, each port represented by a single point (source study §2.7.1)"

  # §4.1 limitation: GFW does not expose AIS navigational status, so 'at_berth'
  # and 'anchored' are separated by distance alone. For the 12,000-14,499 TEU
  # band this is a 1,300 vs 1,800 kW auxiliary difference, and vessel A spends
  # 24.9% of the study period inside port visits.

# =============================================================================
