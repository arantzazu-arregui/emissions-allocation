  # Decision tree that OVERRIDES the table for small ships, quoted from p.68:
  overrides:
    - {mcr_min: 0,   mcr_max: 150, rule: "auxiliary engine and boiler both set to zero"}
    - {mcr_min: 150, mcr_max: 500, rule: "auxiliary engine = 5% of installed main engine power; boiler from the table"}
    - {mcr_min: 500, mcr_max: null, rule: "table values used as-is"}
    # Neither override applies to vessel A.

  ship_types:

    container:
      size_unit: TEU
      bands:
        - {min: 0,     max: 999,   boiler: [250, 250, 240, 0], auxiliary: [370,  450,  790,  410]}
        - {min: 1000,  max: 1999,  boiler: [340, 340, 310, 0], auxiliary: [820,  910,  1750, 900]}
        - {min: 2000,  max: 2999,  boiler: [460, 450, 430, 0], auxiliary: [610,  910,  1900, 920]}
        - {min: 3000,  max: 4999,  boiler: [480, 480, 430, 0], auxiliary: [1100, 1350, 2500, 1400]}
        - {min: 5000,  max: 7999,  boiler: [590, 580, 550, 0], auxiliary: [1100, 1400, 2800, 1450]}
        - {min: 8000,  max: 11999, boiler: [620, 620, 540, 0], auxiliary: [1150, 1600, 2900, 1800]}
        - {min: 12000, max: 14499, boiler: [630, 630, 630, 0], auxiliary: [1300, 1800, 3250, 2050]}  # <- vessel A
        - {min: 14500, max: 19999, boiler: [630, 630, 630, 0], auxiliary: [1400, 1950, 3600, 2300]}
        - {min: 20000, max: null,  boiler: [700, 700, 700, 0], auxiliary: [1400, 1950, 3600, 2300]}

    bulk_carrier:
      size_unit: dwt
      bands:
        - {min: 0,      max: 9999,   boiler: [70,  70,  60,  0], auxiliary: [110, 180, 500,  190]}
        - {min: 10000,  max: 34999,  boiler: [70,  70,  60,  0], auxiliary: [110, 180, 500,  190]}
        - {min: 35000,  max: 59999,  boiler: [130, 130, 120, 0], auxiliary: [150, 250, 680,  260]}
        - {min: 60000,  max: 99999,  boiler: [260, 260, 240, 0], auxiliary: [240, 400, 1100, 410]}
        - {min: 100000, max: 199999, boiler: [260, 260, 240, 0], auxiliary: [240, 400, 1100, 410]}
        - {min: 200000, max: null,   boiler: [260, 260, 240, 0], auxiliary: [240, 400, 1100, 410]}

    oil_tanker:
      size_unit: dwt
      bands:
        - {min: 0,      max: 4999,   boiler: [500,  100, 100, 0],   auxiliary: [250,  250, 375,  250]}
        - {min: 5000,   max: 9999,   boiler: [750,  150, 150, 0],   auxiliary: [375,  375, 560,  375]}
        - {min: 10000,  max: 19999,  boiler: [1250, 250, 250, 0],   auxiliary: [690,  500, 580,  490]}
        - {min: 20000,  max: 59999,  boiler: [2700, 270, 270, 270], auxiliary: [720,  520, 600,  510]}
        - {min: 60000,  max: 79999,  boiler: [3250, 360, 360, 280], auxiliary: [620,  490, 770,  560]}
