# Ship specifications and the parameters the emission model needs.
#
# EVERY estimated parameter carries `value`, `source` and `method`, so a researcher
# with IHS World Register of Shipping access can substitute observed values without
# touching model code. config.py REJECTS an estimated field that is missing any of
# the three.
#
# `estimated: true` means the number was derived or assigned, not observed. It is
# surfaced in every notebook table so a reader is never unsure which is which.
#
# THE CENTRAL DATA CONSTRAINT (docs/METHODOLOGY.md §2): no free source supplies
# installed power or design speed. The IMO Fourth GHG Study's own fallback
# regressions (equations 3 and 4) publish only symbolic coefficients and are
# mutually circular -- speed needs power, power needs speed. Three independent
# estimates are therefore carried in parallel with NO PRIMARY.

# =============================================================================
# defaults -- shared regression constants, not per-hull
# =============================================================================
defaults:

  # --- §2.1 TEU capacity -----------------------------------------------------
  # IMO Table 17 indexes container ships by TEU; Equasis does not carry TEU.
  # Inverted to TEU = (B / coefficient)^(1/exponent).
  teu_from_beam:
    coefficient: 3.27
    exponent: 0.29
    source: "Cepowski & Chorab (2021), Ocean Engineering 238, 109727 -- beam relation, fitted on 215 container designs built 2015-2020"
    method: "inverted; beam is the better proxy for container ships because it sets the on-deck row count"
    estimated: true
    # Their draught relation gives 15,840 TEU for this hull; beam gives 13,174.
    # Their TEU-based LBP relation (LBP = 3.16*TEU^0.34) returns 79.5 m at
    # 13,200 TEU and is evidently mis-transcribed. NOT USED.

  # Deadweight relations, used only to validate the inversion above -- they are
  # not inputs to the model. Reported in the notebook as the basis for trusting it.
  hull_from_dwt_validation:
    lbp: {coefficient: 3.656, exponent: 0.38}   # -> 344.4 m vs LOA 365.9 (LBP ~ 0.95 LOA)
    beam: {coefficient: 1.15, exponent: 0.32}   # ->  52.8 m vs actual 51.2
    draught: {coefficient: 0.624, exponent: 0.27}  # -> 15.8 m vs actual 16.0
    source: "Cepowski & Chorab (2021)"
    method: validation only
    estimated: true

  # --- §2.2 estimate A -- IMO EEXI curve fit ---------------------------------
  # The active, complete MEPC.333(76) parameter tables are in
  # config/eexi_parameters.yaml. config.py reads that file directly; do not add a
  # second copy here because divergent coefficients, caps, and key names are a
  # silent source of wrong power estimates.

  # --- §4.2 reference-load and speed-power parameters ------------------------
  # Every estimate carries its own reference load. V_ref/service speed is normally
  # reached below MCR, so a shared 100%-MCR anchor is physically wrong.
  power_reference:
    A:
      default:
        load_at_reference: 0.75
        reference_condition: "calm-water summer-load-draught EEXI V_ref at 75% original MCR"
        speed_exponent: 3.0
        source: "IMO Resolution MEPC.333(76), paragraph 2.2.3.5"
        method: "V_ref is evaluated at 75% original MCR (or 83% limited MCR); original MCR_avg is used here"
    B:
      container:
        load_at_reference: 1.0
        reference_condition: "Charchalis Table 1 total propulsion power at its paired service speed; installed-MCR fraction unresolved"
        speed_exponent: 3.0
        source: "Charchalis (2014), Table 1"
        method: "provisional reference-power formulation; do not interpret its calibrated power as an independently verified MCR"
    D:
      by_ship_type:
        container:
          load_at_reference: 0.83
          reference_condition: "EPA service-speed convention (83% rated power)"
          speed_exponent: 3.0
          source: "USEPA ShipPowerModel"
          method: "P_ref at service speed is 83% of installed propulsive power"
        vehicle:
          load_at_reference: 0.75
          reference_condition: "calm-water summer-load-draught EEXI V_ref paired with EPA rated power"
          speed_exponent: 3.0
          source: "IMO Resolution MEPC.333(76), paragraph 2.2.3.5; EPA DWT power regression"
          method: "The D scenario uses Estimate A's EEXI V_ref, so it inherits the EEXI 75%-MCR reference fraction"

  # --- §2.2 estimate B -- Admiralty coefficient, calibrated ------------------
  # V   = Fn * sqrt(g * L_BP) / 0.5144        [knots]
  # MCR = displacement^(2/3) * V^3 / C_adm
  #
  # EVERY PARAMETER HERE IS HULL-FORM SPECIFIC, so they are keyed by ship type and
  # a type with no calibration RAISES rather than borrowing another's. Charchalis
  # published 17 container ships; there is no equivalent table for car carriers,
  # ro-ros or tankers, and C_adm, the block coefficient and the Froude range all
  # differ materially between hull forms.
  #
  # Silently reusing the container numbers for a vehicle carrier would return a
  # confident, wrong figure -- which is exactly the failure mode the three-estimate
  # design exists to expose, not to commit.
  admiralty:
    seawater_density:
      value: 1.025
      unit: t/m3
      source: standard
      method: constant
      estimated: false

    by_ship_type:
      container:
        c_adm:
          median: 482
          mean: 478
          sd: 57
          min: 352
          max: 593
          source: "Charchalis (2014), Journal of KONES 21(2), 39-44 -- Table 1, 17 container ships with matched speed, power and displacement"
          method: "calibrated; consistent with the textbook 400-600 band"
          estimated: true
          # WEAKEST JOINT: calibrated on 1,200-1,400 TEU feeders and extrapolated
          # across a tenfold size jump to vessel A.
        froude_number:
          min: 0.19
          max: 0.21
          source: "Cepowski & Chorab (2021) -- modern container fleet mean is 0.21"
          method: "range; larger recent ships trend lower"
          estimated: true
        block_coefficient:
          value: 0.61
          source: "docs/METHODOLOGY.md §2.2"
          method: assigned
          estimated: true
        dwt_to_displacement_ratio:
          value: 0.80
          source: "Charchalis (2014)"
          method: "displacement = DWT / 0.80"
          estimated: true
          # The two displacement routes differ by ~18% on Charchalis's own worked
          # example -- a real convention difference, so both are carried.

      # NOT CALIBRATED. No published Admiralty coefficient, block coefficient or
      # Froude range is held for these hull forms. specs.estimate_b_admiralty
      # raises for any of them; drop 'B' from run.power_estimates, or supply a
      # sourced calibration here, before modelling such a hull.
      #
      # A car carrier is the clearest case: its block coefficient and displacement
      # ratio are nothing like a container ship's, and its DWT/GT of 0.367 against
      # a boxship's 1.013 shows why.
      vehicle: null
      ro_ro: null
      bulk_carrier: null
      oil_tanker: null
      chemical_tanker: null
      general_cargo: null
      liquefied_gas_tanker: null
      refrigerated_bulk: null
      ferry_ropax: null
      ferry_pax_only: null
      cruise: null
      other_liquids_tanker: null

  # --- §2.2 estimate D -- EPA main-engine-power regression ------------------
  # The source relates DWT directly to rated main-engine horsepower. It is NOT
  # inferred by reversing Table 17 auxiliary operating loads. For a runnable
  # (V_ref, MCR) scenario, D needs a separately configured speed pairing. The
  # container row uses the container-hull Froude range; the vehicle row uses the
  # EEXI vehicle-carrier reference speed because no vehicle Froude calibration is
  # held here.
  epa_dwt_power:
    hp_to_kw: 0.745699872
    source: "EPA (2000), Analysis of Commercial Marine Vessels Emissions and Fuel Consumption Data, EPA420-R-00-002, Tables 4-3 and 4-5"
    method: "linear regression of rated main-engine horsepower on DWT; horsepower converted to kW"
    estimated: true
    by_ship_type:
      container:
        slope_hp_per_dwt: 0.80
        intercept_hp: -749.4
        sample_size: 489
        r_squared: 0.59
        typical_dwt_range_t: [20000, 70000]
        speed_pairing: froude
        speed_pairing_note: "Froude-number range from defaults.admiralty.by_ship_type.container; MCR is not reused from the Admiralty relation"
      vehicle:
        # EPA Table 4-5's recommended pooled relation for container/RoRo/auto
        # carrier/reefer ships. RCC AMERICA is an Equasis "Vehicles Carrier".
        # EPA's auto-carrier-only Table 4-3 fit has R2=0.176; the pooled fit is
        # materially stronger (R2=0.71, N=917), so it is used as the primary D
        # sensitivity rather than the type-specific but unstable relation.
        slope_hp_per_dwt: 0.719
        intercept_hp: 2581
        sample_size: 917
        r_squared: 0.71
        typical_dwt_range_t: [5000, 70000]
        speed_pairing: eexi
        speed_pairing_note: "MEPC.333(76) vehicle-carrier reference speed; EPA estimates MCR only"

  # --- §8.2 fleet-envelope validation check ----------------------------------
  # Also hull-form specific: 6.0-24.5 kn is the CONTAINER fleet's range and says
  # nothing about a car carrier. A type with no published envelope returns None
  # (unknown) rather than a spurious pass or fail.
  fleet_speed_envelope:
    container:
      min_kn: 6.0
      max_kn: 24.5
      source: "Cepowski & Chorab (2021), Table 1 -- 215 distinct container designs built since 2015"
      method: "observed range of service speeds"
      estimated: false

  # --- §2.3 engine type ------------------------------------------------------
  default_engine_type:
    value: SSD
    source: "IMO Fourth GHG Study 2020 -- slow-speed diesel is the stated default for any oil-propelled ship not otherwise classifiable; Table 10 gives engine-type shares by year"
    method: "assigned; the IHS engine field the study uses is unavailable to us"
    estimated: true

# =============================================================================
# Per-IMO blocks
# =============================================================================
vessels:

  "9516454":   # COSCO ITALY
    name: COSCO ITALY
    mmsi: {value: "477845600", source: "GFW presence + Equasis", method: observed, estimated: false}
    callsign: {value: VRNE4, source: "GFW registryInfo + Equasis", method: observed, estimated: false}
    flag: {value: HKG, source: "Equasis; GFW registryInfo.flag", method: observed, estimated: false}
    ship_type: {value: container, source: Equasis, method: observed, estimated: false}
    year_built: {value: 2014, source: Equasis, method: observed, estimated: false}

    dwt: {value: 156610, unit: t, source: Equasis, method: observed, estimated: false}

    # Equasis and GFW disagree on gross tonnage: Equasis 154,592 (since 2023),
    # GFW registryInfo[0].tonnageGt 153,666. GT is NOT an input to the emission
    # model -- deadweight drives every regression -- so both are recorded rather
    # than reconciled.
    gt: {value: 154592, unit: t, source: "Equasis (since 2023)", method: observed, estimated: false}
    gt_gfw: {value: 153666, unit: t, source: "GFW registryInfo.tonnageGt", method: observed, estimated: false}

    loa_m: {value: 365.90, source: public vessel registers, method: observed, estimated: false}
    beam_m: {value: 51.20, source: public vessel registers, method: observed, estimated: false}
    draught_m: {value: 16.0, source: public vessel registers, method: observed, estimated: false}

    # L_BP is not published for this hull. Estimate B needs it for the Froude
    # number. LBP ~ 0.95 * LOA is the standard container-ship approximation and
    # is corroborated by Cepowski & Chorab's DWT relation (344.4 m predicted).
    lbp_m:
      value: 345.0
      source: "docs/METHODOLOGY.md §2.2"
      method: "LBP ~ 0.95 * LOA, corroborated by Cepowski & Chorab DWT relation (344.4 m)"
      estimated: true

    engine_type: {value: SSD, source: "IMO Fourth GHG Study 2020 default (§2.3)", method: assigned, estimated: true}

    # teu is DERIVED at runtime by specs.py from beam_m. Not hand-entered, so that
    # the inversion is exercised rather than asserted. Expected ~13,174.
    teu: derived

    power_estimates:
      # A and B are derived at runtime from the defaults block above.
      A: derived
      B: derived

      # --- OPEN ITEM 4 -----------------------------------------------------
      # Estimate C is a SOURCED specification -- installed power and service speed
      # from shipbuilder or class-society records for this specific hull. Most
      # defensible for the pilot; does not scale.
      #
      # NOT FOUND. specs.py raises MissingParameter naming this field if 'C' is
      # listed in pilot.yaml run.power_estimates while these are null. No
      # plausible default is substituted -- these two numbers look guessable and
      # are not.
      C:
        mcr_kw: {value: null, source: null, method: null, estimated: true}
        design_speed_kn: {value: null, source: null, method: null, estimated: true}
        reference: {value: null, source: null, method: null, estimated: true}

    # --- §5.1 allocation keys ------------------------------------------------
    # Equasis supplies an IMO company identification number per role, which gives
    # the fleet-scale version a stable join key rather than fuzzy name matching.
    #
    # All three commercial roles resolve to China while the flag is Hong Kong.
    # That is the pattern Selin et al. quantify at fleet scale, and it is why
    # vessel A alone produces a degenerate result.
    allocation_keys:
      flag:
        country: HKG
        # Global Carbon Budget keys its baselines by country NAME, not ISO3, so
        # each allocation key carries the name to join on. Kept here rather than in
        # a separate lookup table so that adding a vessel stays a config edit in one
        # place, and so a hull whose country the GCB does not carry fails loudly
        # instead of dropping out of the aggregation.
        #
        # Record where the company actually sits. Which national budget carries it
        # is decided by territory_alignment in pilot.yaml, not here -- Hong Kong is
        # one of seven territories in that position, and hard-coding its merge here
        # was a scaling defect.
        gcb_name: Hong Kong
        source: "Equasis; GFW registryInfo.flag"
        method: observed
        estimated: false
      owner:
        country: CHN
        gcb_name: China
        company: COSCO ITALY SHIPPING LTD
        company_imo: "4178111"
        address: "C/O COSCO Shipping Lines, Shanghai"
        source: "Equasis registered owner"
        method: "address-derived"
        estimated: true
        # CAVEAT (§5.2): Equasis gives an ADDRESS, not a country of incorporation.
        # This is a single-purpose company whose place of registration is not
        # stated. Selin et al. used WRS's owner-country field, a different
        # construct.
        #
        # GFW registryOwners[0].flag returns HKG -- identical to the ship's flag
        # and contradicting the Shanghai address. It appears to echo the ship
        # flag rather than record owner domicile. NOT USED.
      manager:
        country: CHN
        gcb_name: China
        company: SHANGHAI OCEAN SHIPPING CO LTD
        company_imo: "5193283"
        source: "Equasis ISM manager"
        method: "address-derived"
        estimated: true
      operator:
        country: CHN
        gcb_name: China
        company: COSCO SHIPPING LINES CO LTD
        company_imo: "1043944"
        source: "Equasis commercial manager"
        method: "PROXY -- Equasis has no operator field"
        estimated: true
        # CAVEAT (§5.2): this partially collapses the operator and manager
        # options and must be reported as such.
      bunker:
        country: null
        source: null
        method: "not computable at n=2 -- requires national marine-bunker sales statistics"
        estimated: false
        # Out of scope BY CONSTRUCTION, not by omission. Four of the paper's five
        # options are reproduced; the fifth is a fleet-scale construct by nature.

  "9277802":   # RCC AMERICA
    name: RCC AMERICA
    mmsi: {value: "311595000", source: Equasis, method: observed, estimated: false}
    callsign: {value: C6TD4, source: Equasis, method: observed, estimated: false}
    flag: {value: BHS, source: Equasis, method: observed, estimated: false}
    ship_type: {value: vehicle, source: "Equasis -- Vehicles Carrier since 01/11/2003", method: observed, estimated: false}
    year_built: {value: 2003, source: Equasis, method: observed, estimated: false}
    dwt: {value: 21182, unit: t, source: Equasis, method: observed, estimated: false}
    gt: {value: 57718, unit: t, source: "Equasis (2003)", method: observed, estimated: false}

    # DWT/GT = 0.367. A container ship sits near 1.0 (vessel A: 1.013), so this hull
    # carries under a THIRD the deadweight per unit of size -- enclosed volume, not
    # weight, is what a car carrier is built around. MEPC.333(76) §2.2.7 writes a
    # cubic capacity correction for exactly this, applying below DWT/GT of 0.35;
    # this hull sits just above the threshold so it does not trigger.
    #
    # LOA, beam, draught and L_BP are NOT recorded. They are inputs to estimate B
    # and to the §2.1 TEU inversion, neither of which applies to this hull, so
    # inventing them would add nothing but risk. Add them if estimate B is ever
    # calibrated for vehicle carriers.

    engine_type: {value: SSD, source: "IMO Fourth GHG Study 2020 default (§2.3)", method: assigned, estimated: true}

    power_estimates:
      A: derived
      # B is excluded in pilot.yaml -- no Admiralty calibration exists for this
      # hull form. See specs.estimate_b_admiralty.
      C:
        mcr_kw: {value: null, source: null, method: null, estimated: true}
        design_speed_kn: {value: null, source: null, method: null, estimated: true}
        reference: {value: null, source: null, method: null, estimated: true}

    # --- §5.1 allocation keys ------------------------------------------------
    # THREE distinct national budgets, which is the whole point of vessel B.
    # Equasis, 2026-08-16.
    allocation_keys:
      flag:
        country: BHS
        gcb_name: Bahamas
        source: Equasis
        method: observed
        estimated: false
      owner:
        country: IMN
        gcb_name: Isle of Man          # -> United Kingdom via territory_alignment
        company: AMERICA MARITIME LTD
        company_imo: "5060047"
        address: "C/O Ray Car Carriers Ltd, 33-37 Athol Street, Douglas, Isle of Man"
        source: "Equasis registered owner, since 01/11/2003"
        method: "address-derived"
        estimated: true
        # Same §5.2 caveat as vessel A: Equasis gives an ADDRESS, not a country of
        # incorporation. A single-purpose company c/o its commercial manager.
      manager:
        country: GRC
        gcb_name: Greece
        company: STAMCO SHIP MANAGEMENT CO LTD
        company_imo: "1546779"
        address: "21 Akti Miaouli, 185 35 Piraeus, Greece"
        source: "Equasis ISM manager, since 05/12/2003"
        method: "address-derived"
        estimated: true
      operator:
        country: IMN
        gcb_name: Isle of Man          # -> United Kingdom via territory_alignment
        company: RAY CAR CARRIERS LTD
        company_imo: "4064909"
        address: "33-37 Athol Street, Douglas, Isle of Man"
        source: "Equasis commercial manager, since 01/01/2003"
        method: "PROXY -- Equasis has no operator field"
        estimated: true
      bunker:
        country: null
        source: null
        method: "not computable at n=2 -- requires national marine-bunker sales statistics"
        estimated: false

  # --- Further vessels -----------------------------------------------------
  # Add the block here once §0.2 and the Equasis lookup are done. Required
  # fields mirror vessel A: dwt, beam_m, lbp_m, ship_type, engine_type, and the
  # four allocation_keys. MEPC.333(76) constants live in
  # config/eexi_parameters.yaml; add an explicit power_reference row before a new
  # power/speed pairing is modelled.
