# Pilot run configuration.
#
# Everything vessel-specific lives here or in vessel_specs.yaml, never in code.
# Scaling from two vessels to the full fleet is a loop over `vessels`, not an edit
# to any module. See docs/METHODOLOGY.md and CLAUDE.md.

study:
  # Selin et al. replication window. Inclusive of both endpoints.
  # Presence is pulled one request per calendar year: [YYYY-01-01, YYYY+1-01-01).
  start_date: 2017-01-01
  end_date: 2024-12-31

# GFW's AIS-presence archive is available from 2012 to approximately four days
# before retrieval. It is acquired separately from the fixed analysis window above.
# These thresholds define an *observed-active* label only: no observation means
# unobserved, never inactive. See METHODOLOGY.md §0.3.
gfw_observed_activity:
  start_date: 2012-01-01
  availability_lag_days: 4
  min_observed_hours: 24
  min_observed_days: 3

vessels:
  # --- Vessel A --------------------------------------------------------------
  # Fixed. The co-located majority: flag HKG, all three commercial roles -> China.
  - imo: "9516454"
    label: A
    # The presence filter matches on shipname, EXACTLY and CASE-SENSITIVELY.
    # A wrong name returns HTTP 200 with zero rows and no error, so every name the
    # hull has carried inside the study period must be listed here. `in (...)`
    # accepts a list, so the whole rename history fits one request.
    #
    # "NE116" is a genuine former self-reported identity for this hull
    # (2014-04-21 -> 2014-04-27, imo null) but predates the study period, so it is
    # recorded for provenance and not queried.
    shipnames: ["COSCO ITALY"]
    former_shipnames_outside_period: ["NE116"]

  # --- Vessel B --------------------------------------------------------------
  # RCC AMERICA. Selected by §0.2: discovered from a live world-extent presence
  # query over six open registries, name confirmed distinct in a 15,417-hull pool,
  # present in all eight sampled years, 588 port calls across 64 countries with 122
  # EU calls. Criterion 7 closed by hand in Equasis, which is the step no API can do.
  #
  # This is the open-registry contrast vessel A cannot provide. Its four allocation
  # keys resolve to THREE distinct national budgets -- Bahamas, United Kingdom and
  # Greece -- where vessel A's collapse to one.
  - imo: "9277802"
    label: B
    # THETIS-MRV shows this hull reported as HOEGH AMERICA for 2018 and RCC AMERICA
    # from 2019, so it was renamed inside the study period.
    #
    # VERIFIED, not assumed: GFW's presence records return "RCC AMERICA" for every
    # year including 2017 and 2018 -- the presence filter matches the vessel's
    # CURRENT identity, not the name it transmitted at the time. So the pull did not
    # silently truncate, and 2018's 88.7% coverage is genuine reception thinness.
    #
    # The former name is listed anyway. It costs one extra term in an `in (...)`
    # filter and protects the series if GFW ever keys on the historical name --
    # which would otherwise show up as a plausible-looking coverage figure and
    # nothing else.
    shipnames: ["RCC AMERICA", "HOEGH AMERICA"]

    # Estimates A and D. Estimate B's Admiralty coefficient is calibrated on 17
    # container ships (Charchalis 2014) and there is no published equivalent for a
    # vehicle carrier -- C_adm, the block coefficient and the Froude range are all
    # hull-form specific. specs.estimate_b_admiralty raises for this type rather
    # than borrowing container numbers, so it is excluded here rather than left to
    # fail at run time. Estimate D instead uses EPA's recommended pooled
    # container/RoRo/auto-carrier/reefer MCR regression and A's EEXI reference
    # speed; its label records this hybrid pairing.
    #
    # Read the resulting figure with the §8.2 caveat in view: against EMSA-verified
    # emissions, estimate A UNDERSTATES vessel A by 36% (0.64x) while estimate B
    # matches at 0.98x. D supplies an independent MCR estimate, but shares A's
    # speed and therefore does not bracket speed uncertainty. Estimate C -- this
    # hull's actual MCR and service speed from class-society records -- remains the
    # preferred validation target.
    power_estimates: [A, D]

run:
  # --- Sensitivity axes (docs/METHODOLOGY.md §8.1) ---------------------------
  # These are RANGES carried through the scenario cross join, not point estimates.
  # emissions_hour is keyed by every combination.

  # §1.6 centred moving-average width, in hours. Must be odd (centred).
  # w=1 is the unsmoothed series, retained as the baseline that shows the v^3 bias.
  # OPEN ITEM 5: the window is validated on one day of data only.
  smoothing_windows: [1, 3, 5, 7]

  # §2.2. Which power/speed estimates to carry. Estimates A, B, and D are derived
  # at runtime from hull dimensions. Estimate C is a SOURCED specification and is
  # null in vessel_specs.yaml (OPEN ITEM 4) -- listing it here without supplying
  # the values raises MissingParameter rather than substituting a default.
  power_estimates: [A, B, D]

  # --- §1.2 assertion (c): presence-pull integrity ---------------------------
  #
  # Assertion (c) exists to catch a PARTIAL PULL -- the API returning HTTP 200 with
  # only part of a year, from a timeout mid-response or a filter that accidentally
  # narrowed. An hours threshold alone cannot do that job, because it cannot tell
  # "the API returned half the year" from "the vessel was laid up half the year".
  # Both look like 50%.
  #
  # Measured coverage for vessel A varies far more than METHODOLOGY §1.7 assumes,
  # which quotes only 2024:
  #   2017 82.0% | 2018 71.2% | 2019 36.1% | 2020 72.7%
  #   2021 93.2% | 2022 97.0% | 2023 99.8% | 2024 99.98%
  # so a single strict floor rejects six of eight legitimate years.
  #
  # Three checks replace it. See activity.classify_gaps.

  # Hard floor. A year returning almost nothing is broken, not thin. Raises.
  hour_coverage_floor: 0.10

  # Warning threshold. Flags the year low-confidence and records the figure;
  # does not stop the run.
  hour_coverage_warn: 0.95

  # Structural check, and the strong one. Any contiguous presence gap at or above
  # this length must contain ZERO port calls, or the presence pull is genuinely
  # broken and the loader raises.
  #
  # This is a cross-ENDPOINT consistency test, which is what gives it force:
  # presence comes from 4Wings filtered on shipname, port visits from /v3/events
  # keyed on vesselId. Two different query paths. If one says the vessel was absent
  # while the other says it called at a port, something is wrong with the pull.
  #
  # It is also what diagnosed vessel A's 2019-06-10 -> 2020-03-18 absence as
  # genuine: 282 contiguous days with zero presence hours AND zero port calls, both
  # datasets independently agreeing the hull was out of service.
  inactivity_gap_days: 7

  # --- §4.5 coverage correction ---------------------------------------------
  # Gaps are classified before any correction is applied.
  #
  # Scattered reception gaps are correctable: the vessel was trading and hours were
  # missed, so E / coverage recovers them. 2017 has 615 such runs, none over 7 days.
  #
  # Contiguous absences are NOT correctable. Dividing 2019 by its raw 36.1%
  # coverage would multiply emissions by 2.77x for a ship that was not sailing,
  # fabricating roughly nine months of phantom voyages. Those hours are excluded
  # from the denominator instead, and carry no emissions.
  #
  # This is a documented departure from METHODOLOGY §4.5, which treats the
  # correction as uniform and negligible on the strength of 2024 alone.
  coverage_correction: true

  # --- §1.7 Fourth IMO GHG Study SOG-infill sensitivity --------------------
  # This is deliberately NOT the primary treatment. The Fourth IMO method fills
  # a missing transmitted SOG where an activity report still exists; a missing
  # GFW presence hour loses both position and SOG. We therefore use port-visit
  # events to proxy port/transition/voyage phases, apply phase-mean SOG only to
  # short reception gaps, and retain the primary treatment for longer gaps.
  imo2020_sog_sensitivity:
    enabled: true
    transition_hours: 6
    missing_gap_bounds_hours: [6, 72]

  # --- §4.1 At berth vs Anchored --------------------------------------------
  # Table 16 separates these by distance to port, because the IMO study had no
  # better signal; METHODOLOGY §4.1 flags the exposure ("GFW does not expose AIS
  # navigational status, so 'at berth' and 'anchored' are separated by distance
  # alone").
  #
  # We do have a better signal. A GFW port-visit event asserts, from a different
  # endpoint and with a confidence score, that the vessel was in port between two
  # timestamps. When true, an hour at <=1 kn inside a port-visit interval is At
  # berth regardless of its distance to an anchorage point.
  #
  # It matters: GFW anchorage coordinates sit some way off the berth, so the
  # distance test put only 1,143 h at berth against 17,427 h actually inside port
  # visits -- pushing ~16,000 h onto 1,800 kW auxiliary instead of 1,300 kW on a
  # hull that spends a quarter of the period in port.
  #
  # Set false to restore strict Table 16 behaviour and compare.
  use_port_visit_intervals: true

paths:
  raw: data/raw
  interim: data/interim
  out: data/out
  external: data/external

spatial:
  # Read directly out of the zips by DuckDB's spatial extension via GDAL /vsizip/.
  eez: data/external/marineregions/World_EEZ_v12_20231025_gpkg.zip
  high_seas: data/external/marineregions/World_High_Seas_v2_20241010_gpkg.zip
  eca_sox_pm: data/external/marineregions/eca_reg14_sox_pm.zip

  # Path to the layer INSIDE each archive. Named explicitly rather than discovered,
  # because the EEZ zip holds two GeoPackages: eez_v12.gpkg (285 polygons, what
  # §5.4 needs) and eez_boundaries_v12.gpkg (2,349 linestrings). Choosing the
  # boundaries would make every point-in-polygon test return nothing, silently.
  layers:
    eez: World_EEZ_v12_20231025_gpkg/eez_v12.gpkg
    eca_sox_pm: eca_reg14_sox_pm/eca_reg14_sox_pm.shp
    coastline: EEZ_land_union_v4_202410/EEZ_land_union_v4_202410.shp

  # OPEN ITEM 3 -- REQUIRED BY §4.1 AND NOT YET PRESENT.
  # The Table 16 operating-mode matrix needs distance-to-coast per vessel-hour.
  # Distance-to-port cannot stand in: beyond 5 nm from any port, coast distance is
  # what separates Anchored from Slow transit, and their auxiliary loads differ
  # (1,800 vs 2,050 kW).
  #
  # RESOLVED. Marine Regions "Marine and Land Zones v4" ships as EEZ_land_union --
  # 328 polygons, each a country's LAND MERGED WITH ITS EEZ. It is not a coastline
  # layer, so the coastline is derived:
  #
  #     land_c   = union_c  MINUS  eez_c        (per country, joined on MRGID_EEZ)
  #     coast    = the boundary of that land
  #
  # 285 of the 328 union polygons pair with an EEZ polygon; 253 yield non-empty
  # land (the rest are EEZ areas around features with no mapped land). The other
  # 41 are landlocked countries, which have no EEZ and no coastline.
  #
  # CAVEAT, and it is a real one: EEZ v12 is measured from the territorial-sea
  # BASELINE, so internal waters -- harbours, bays landward of the baseline -- fall
  # into the difference and read as "land". Distance-to-coast is therefore measured
  # from the baseline rather than the physical shoreline. For vessel A this affects
  # 0.2% of distinct positions, all of them in harbours, where the result is
  # distance 0 and the ship is inside 1 nm of a port anyway -- so the Table 16
  # column is unchanged. On a deeply indented coast the two would diverge more.
  #
  # The IMO Fourth GHG Study measures these distances against Natural Earth
  # coastline shapefiles (stated on the Table 16 page, printed p.66), which are
  # physical shorelines and would not have this caveat. Marine and Land Zones was
  # chosen instead because it shares a publisher, CRS and coding scheme with
  # EEZ v12 and High Seas v2, keeping every layer joinable without a second
  # convention -- and because deriving land from it reuses the EEZ layer already
  # loaded for §5.4. Swapping to Natural Earth is a change to this key plus
  # 23_distance_to_coast.sql, and is worth testing if the berth/anchored split
  # turns out to drive the result.
  coastline: data/external/marineregions/EEZ_land_union_v4_202410.zip
  #
  # ALTERNATIVE, and arguably the more faithful one: the IMO Fourth GHG Study
  # measures these distances against "the world's coastal lines, freely available
  # from Natural Earth data (shapefiles)" -- stated on the Table 16 page itself
  # (printed p.66). Using Natural Earth would reproduce the source study's own
  # method rather than approximate it, and the download is far smaller.
  #
  # Marine and Land Zones was chosen instead because it is already the project's
  # spatial vocabulary (same publisher, same CRS and coding scheme as EEZ v12 and
  # High Seas v2), which keeps every layer joinable without a second convention.
  # The two differ mainly in coastline generalisation, which matters at the 1 nm
  # threshold and much less at 5 nm. Swapping is a one-line change here plus a
  # rerun of §4; 23_distance_to_coast.sql reads whatever layer this key names.
  # Worth testing both if the berth/anchored split turns out to drive the result.

# =============================================================================
# §6.3 -- territory alignment
# =============================================================================
# Selin et al. supplementary Table 1 (data/external/paper/erlabec02supp2.xls,
# sheet "All") is the authoritative territory-alignment source for this
# replication.  Its published country list has no Hong Kong row, so Hong Kong is
# assigned to China.  This is a fixed replication rule, not a sensitivity axis.
#
# A territory absent from the GCB has NO BASELINE AT ALL, so a vessel whose owner or
# manager sits there would silently drop out of the impact aggregation -- it would
# not appear in any ranking and nothing would say why. Mapping is therefore
# mandatory, and config.py asserts that every allocation key resolves to a country
# the GCB actually carries.
#
# This is DATA, not code. Adding a hull owned in Bermuda is a line here.
territory_alignment:
  source: data/external/paper/erlabec02supp2.xls
  sheet: All
  merge_into:
    Hong Kong: China
    Macao: China
    Isle of Man: United Kingdom      # Crown Dependency; RCC AMERICA's owner and operator
    Jersey: United Kingdom
    Guernsey: United Kingdom
    Gibraltar: United Kingdom
    Cayman Islands: United Kingdom
    Falkland Islands: United Kingdom
    Curacao: Netherlands
    Sint Maarten: Netherlands
    Faroe Islands: Denmark
    Bermuda: United Kingdom
    British Virgin Islands: United Kingdom
    Aruba: Netherlands
    Greenland: Denmark

validation:
  # §8.2. THETIS-MRV is EU-scope and is used ONLY to validate, never as an input.
  # No export is present; §8 reports PENDING -- UNVERIFIED until one appears.
  # Export IMO 9516454 from https://mrv.emsa.europa.eu/ to:
  thetis_mrv: data/external/thetis/

  # Figures established from the captured API responses in data/sample/api/.
  # activity.py asserts against these; a mismatch means something upstream moved.
  expected:
    "9516454":
      port_calls_total: 389
      port_calls_all_confidence: "4"
      presence_records_2024: 8782
      elapsed_hours_2024: 8784
      # Observed hours per year, measured 2026-08-16. A change here means the GFW
      # presence dataset moved and downstream figures need rechecking.
      observed_hours_by_year:
        2017: 7185
        2018: 6233
        2019: 3159
        2020: 6388
        2021: 8163
        2022: 8498
        2023: 8743
        2024: 8782
      # The hull was out of service for this window: zero presence hours and zero
      # port calls, from two independent endpoints.
      inactivity_windows:
        - start: 2019-06-10
          end: 2020-03-18
          note: "282 contiguous days, no presence and no port calls"

